<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safari 大文件存储验证</title>
<style>body{font:16px/1.65 system-ui,sans-serif;max-width:700px;margin:40px auto;padding:0 24px;color:#342c24;background:#f8f5ed}button,select{font:inherit;padding:10px 14px;margin:6px 8px 6px 0}progress{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:16px;border-radius:12px}a{display:inline-block;margin:12px 0;color:#b64b23}button:disabled{opacity:.5}[hidden]{display:none!important}</style></head>
<body><h1>Safari 大文件存储验证</h1>
<p>生成无隐私内容的测试文件，分块写入此设备的浏览器存储，再读回校验。完成后需要另行保存文件，并验证导出的内容。</p>
<p>浏览器暂存和导出文件可能同时占用空间。请在保持页面打开的情况下测试，完成后清理测试文件。</p>
<label>文件大小 <select id="size"><option value="512">512 MiB</option><option value="2048" selected>2 GiB</option><option value="5120">5 GiB</option><option value="10240">10 GiB</option><option value="20480">20 GiB</option></select></label>
<div><button id="start" disabled>开始本地验证</button><button id="cancel" disabled>取消</button><button id="cleanup" disabled>清理浏览器测试文件</button></div>
<progress id="progress" max="100" value="0"></progress><p id="status" role="status">正在检查浏览器能力…</p>
<a id="save" hidden>保存测试文件</a><pre id="result"></pre>
<script type="module" src="./probe.js"></script></body></html>

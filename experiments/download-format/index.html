<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PizzaSend 下载格式验证</title>
<style>body{font:18px system-ui;margin:32px;line-height:1.7}a,button{display:block;margin:20px 0}pre{white-space:pre-wrap}</style>
<h1>下载格式验证</h1>
<p>使用正式暂存模块；测试视频和图片应保留原扩展名，并能直接播放或查看。</p>
<button id="prepare">生成验证文件</button><pre id="status">等待开始</pre><div id="links"></div>
<script type="module">
import * as storage from '../../src/received-storage.ts';
import { sha256 } from '@noble/hashes/sha2.js';
import { STORAGE_ROOT, diskName } from '../../src/storage-format.ts';
const status = document.getElementById('status'), links = document.getElementById('links');
document.getElementById('prepare').onclick = async event => {
  event.target.disabled = true;
  try {
    const movie = new Uint8Array(await (await fetch('../../tests/fixtures/download-preview.mp4')).arrayBuffer());
    const canvas = document.createElement('canvas'); canvas.width = canvas.height = 2;
    const image = new Uint8Array(await (await new Promise(resolve => canvas.toBlob(resolve, 'image/png'))).arrayBuffer());
    const inputs = [
      { name: 'PizzaSend-格式验证.mp4', type: 'application/octet-stream', bytes: movie },
      { name: 'PizzaSend-图片验证.png', type: '', bytes: image },
      { name: 'PizzaSend-小文件验证.txt', type: 'text/plain', bytes: new TextEncoder().encode('Small files must keep their original format.') }
    ];
    const session = await storage.createTemporarySession(inputs.reduce((n, f) => n + f.bytes.length, 0));
    if (!session) throw Error('Disk storage unavailable');
    for (const [id, input] of inputs.entries()) {
      await storage.beginTemporaryFile(session, { id, name: input.name, size: input.bytes.length, type: input.type });
      const hash = Array.from(sha256(input.bytes), b => b.toString(16).padStart(2, '0')).join('');
      await storage.writeTemporaryFile(session, 0, input.bytes.slice().buffer);
      await storage.finishTemporaryFile(session, hash);
    }
    await storage.completeTemporarySession(session);
    const records = (await storage.listTemporaryFiles()).filter(f => f.session === session);
    const dir = await (await (await navigator.storage.getDirectory()).getDirectoryHandle(STORAGE_ROOT)).getDirectoryHandle(session);
    const results = [];
    for (const record of records) {
      const raw = await (await dir.getFileHandle(diskName(record.info.id))).getFile();
      const old = document.createElement('a'); old.href = URL.createObjectURL(raw); old.download = record.info.name;
      old.textContent = '旧方式：' + record.info.name; links.append(old);
      const url = await storage.temporaryURL(record), a = document.createElement('a'); a.href = url; a.download = record.info.name;
      a.textContent = '修复后：' + record.info.name; a.dataset.fixed = 'true'; links.append(a);
      results.push({ name: record.info.name, oldType: raw.type, fixedType: (await fetch(url)).headers.get('content-type') });
      if (record.info.name.endsWith('.png')) { const img = new Image(); img.src = url; await img.decode(); results.at(-1).imageWidth = img.naturalWidth; }
      if (record.info.name.endsWith('.mp4')) {
        const video = document.createElement('video'); video.controls = true; video.preload = 'metadata'; links.append(video);
        try {
          await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(Error('Video metadata timed out')), 10000);
            video.onloadedmetadata = () => { clearTimeout(timeout); resolve(); };
            video.onerror = () => { clearTimeout(timeout); reject(Error('Video cannot open')); };
            video.src = url; video.load();
          });
          results.at(-1).videoWidth = video.videoWidth; results.at(-1).duration = video.duration;
        } catch (error) { results.at(-1).previewError = error.message; }
      }
    }
    status.textContent = JSON.stringify(results, null, 2);
  } catch (error) { status.textContent = error.message; event.target.disabled = false; }
};
</script>
